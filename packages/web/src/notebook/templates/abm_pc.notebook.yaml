# *************************************************************************
#  Model PC + agent-based microfoundation (ABM-PC)
#  Source: Godley & Lavoie ch.4 (PC), extended with a "job-lottery"
#  Author: Marco Veronese Passarella (Leeds lectures 2026)
# *************************************************************************
#  Description: A tiny "agent-based" version of the textbook PC model:
#  several households, each with its own wealth (cash & bills) and its own
#  spending choice, added up to get the economy-wide totals.
#  Monte Carlo runs in the browser via a declarative abm-model cell
#  interpreted by runAbmSpec.
# *************************************************************************
#  Conventions: upper-case = MACRO total; lower-case = MICRO (one household)
# *************************************************************************
#  Story:
#    - each household decides how much it wants to spend (its OWN alpha1);
#    - the economy needs 1/pr workers for each unit people want to buy;
#    - a random job lottery fills those jobs (some stay unfilled = friction);
#    - whoever works makes pr goods and is paid a wage w = pr;
#    - goods are sold first-come-first-served until they run out;
#    - taxes are paid on labour AND interest income;
#    - portfolio choice splits wealth into bills and cash.
#  One single random shuffle of households per period decides BOTH who gets a
#  job AND who reaches the shop first.
# *************************************************************************
#  Reference R: references/leeds_lectures_2026/ABM_PC.R
#  Upstream: https://github.com/marcoverpas/Leeds_lectures_2026/blob/main/ABM_PC.R
format: sfcr-notebook-yaml
formatVersion: 1
id: abm-pc-notebook
title: ABM-PC Browser Notebook
metadata:
  version: 1
  template: abm-pc
cells:
  - markdown:
      id: intro
      title: Overview
      source: >
        Model **ABM-PC** is Godley and Lavoie Model PC populated by many households.
        Each household holds cash and bills, earns wage and interest income, and has
        its own propensity to consume. Macro totals emerge by summing over agents.
        This notebook runs a Monte Carlo of that agent-based model in the browser from
        a YAML-authored `abm-model` cell. The R reference is
        `references/leeds_lectures_2026/ABM_PC.R`.
      more: |
        Aggregate and IO models are **top-down**: they write economy-wide behavioural
        rules directly. **Agent-based models (ABMs)** are **bottom-up**: they specify
        many individual agents — here households — and obtain macro variables by
        _summing over agents_. Aggregate regularities then **emerge** from interaction
        rather than being imposed.

        Relative to ABM-SIM, Model PC adds a **portfolio choice** between bills and
        cash, and interest income on bills. Taxes fall on labour _and_ interest.
        The baseline experiment raises the policy rate from `2.5%` to `3.5%` at
        period `60`, which shifts household wealth toward bills.

        The model remains **stock-flow consistent**: household cash `H_h` tracks
        central-bank cash supply `H_s`, and government bills satisfy
        `B_s = B_h + B_cb`. Charts show Monte Carlo **means** with p10–p90 bands.
  - abm-model:
      id: abm-pc-model
      title: ABM-PC specification
      modelId: abm-pc
      description: >
        Declarative agent-based PC: heterogeneous households, job lottery, FCFS goods
        market, bill/cash portfolio. Tick order matches Leeds ABM_PC.R. Upper-case names
        are MACRO totals (Monte Carlo means); lower-case / `*_h*` names are MICRO
        histories from MC run 1 only.
      more: |
        **Macro vs micro (Leeds convention).** The R script comments
        `upper-case = MACRO total; lower-case = MICRO (one household)`.

        - **Macro**: every aggregate tick variable is stored automatically as a Monte
          Carlo mean (banded p10–p90).
        - **Micro**: first and last household, all state variables, from **MC run 1
          only** (not averaged) — `c_h1`, `v_hLast`, ….
        - **MC count**: set on the run cell as `abm.monteCarlo` (not on the model).

        Stock-flow check: `|H_h - H_s|` must stay within `tolerance` every period.

        **Period ticks.** One period unfolds as the ordered tick list below: plan
        consumption, hire via a job lottery, shuffle the queue, serve government then
        households first-come-first-served, pay wages and interest taxes, update wealth,
        and allocate the portfolio between bills and cash. The policy rate rises from
        `2.5%` to `3.5%` at period `60`.

        1. Each household plans `cd = min(max(alpha1 * yd + alpha2 * v, 0), v)` using its
           own `alpha1` and last period's disposable income and wealth.
        2. Aggregate demand is `AD = sum(cd) + G`. Labour needed is `Nd = AD / pr`.
        3. Hiring: `N = min(floor(Nd * random.uniform(1-s, 1+s, 1)), floor(Nd), households.size)`.
        4. One random shuffle orders both jobs and the shop queue.
        5. Government is served first; remaining output is rationed FCFS to households.
        6. Hired households earn wage `w = pr`. Interest `lag(r) * b` is taxed with
           labour income at rate `theta`. Wealth updates as `v = v - c + yd`.
        7. Portfolio: `b = v * (lambda0 + lambda1 * r) - lambda2 * yd` (clamped to `[0, v]`);
           cash is the residual `h = v - b`.
        8. Government issues bills to cover its deficit; the central bank absorbs unwanted
           bills and issues cash one-for-one with the change in its bill holdings.
      populations:
        - name: households
          size: 200
          state: [v, b, h, yd, cd, c, y, e]
          params:
            # Homogeneous PC when alpha1d = 0 (R default); run cell can widen the spread
            alpha1: { draw: uniform, lo: 0.6, hi: 0.6 } # Propensity to consume out of income
      params:
        alpha2: 0.4 # Propensity to consume out of wealth (common to all)
        theta: 0.2 # Tax rate (on labour AND interest income)
        pr: 1.1 # Product per worker (labour productivity)
        w: 1.1 # Wage per worker = productivity (=> zero profit)
        s: 0.2 # Size of the hiring randomness
        g0: 20 # Government spending (goods)
        lambda0: 0.635 # Portfolio: baseline share of bills
        lambda1: 5 # Portfolio: sensitivity of bill share to interest rate
        lambda2: 0.01 # Portfolio: sensitivity of bill share to income/wealth
        r0: 0.025 # Baseline policy rate
        r1: 0.035 # Policy rate after shock
        shockPeriod: 60 # Rate rises from 2.5% to 3.5% at period 60
      state:
        aggregates:
          r: 0.025 # Opening policy rate (R: r[1]; period-1 interest uses this)
          B_s: 0 # Opening bills supplied by government
          B_cb: 0 # Opening bills held by central bank
          H_s: 0 # Opening cash supplied by central bank
      ticks:
        # --- TICK 1: households decide how much to spend ---
        - do:
            - [r, "if (t >= shockPeriod) { r1 } else { r0 }", "Policy interest rate (shock from period 60)"]
            - [G, "g0", "Government spending (goods)"]
        - for:
            households:
              - [cd, "min(max(alpha1 * yd + alpha2 * v, 0), v)", "Planned consumption (own alpha1)"]
        - do:
            - [AD, "sum(households.cd) + G", "Total demand for goods"]
            - [Nd, "AD / pr", "Labour needed (1/pr workers per good)"]
            # --- TICK 2: households/workers are hired based on a job lottery ---
            - [N, "min(min(floor(Nd * random.uniform(1 - s, 1 + s, 1)), floor(Nd)), households.size)", "Job lottery hired count"]
        # --- TICK 3: households are re-shuffled ---
        - shuffle: households
        - for:
            households:
              - [e, "if (households.rank <= N) { 1 } else { 0 }", "Employment flag 0/1 (micro, MC run 1)"]
        - do:
            # --- TICK 4: goods are served first-come-first-served (FCFS) ---
            - [Y, "pr * N", "Output / income (MC mean)"]
            - [YG, "min(G, Y)", "Actual government spending (served first)"]
            - [YC, "Y - YG", "Goods left for households"]
        - ration-fcfs:
            population: households
            demand: cd
            supply: YC
            into: c # Household consumption (micro, MC run 1)
        # --- TICK 5: incomes, taxes, wealth ---
        - for:
            households:
              - [y, "w * e", "Wage income if hired (w = pr, zero profit)"]
              - [yd, "(y + lag(r) * b) * (1 - theta)", "Disposable income net of tax on labour and interest"]
              - [v, "v - c + yd", "Household wealth = old wealth - spending + saving"]
              # --- TICK 6: portfolio choice ---
              - [b, "min(max(v * (lambda0 + lambda1 * r) - lambda2 * yd, 0), v)", "Bills held (portfolio)"]
              - [h, "v - b", "Cash held (residual)"]
        # --- TICK 7: government + central bank settle the accounts ---
        - do:
            - [C, "sum(households.c)", "Consumption (MC mean)"]
            - [YD, "sum(households.yd)", "Disposable income (MC mean)"]
            - [V, "sum(households.v)", "Household wealth (MC mean)"]
            - [B_h, "sum(households.b)", "Bills demanded by households"]
            - [H_h, "sum(households.h)", "Cash held by households"]
            - [TAX, "theta / (1 - theta) * YD", "Tax revenue (labour + interest)"]
            - [B_s, "B_s + YG + lag(r) * B_s - TAX - lag(r) * B_cb", "Bills supplied by government"]
            - [B_cb, "B_s - B_h", "Bills held by central bank"]
            - [H_s, "H_s + B_cb - lag(B_cb)", "Cash supplied by central bank"]
            - [UR, "(households.size - N) / households.size", "Unemployment rate, emergent (MC mean)"]
      check: { left: H_h, right: H_s, tolerance: "1e-9" }
  - matrix:
      id: balance-sheet
      accountingKind: balance-sheet
      title: ABM-PC balance sheet (MC means)
      description: >
        Household wealth is bills plus cash. Government bills equal household demand plus
        central-bank holdings. Cash supply mirrors the central bank's bill buffer.
      sourceRunCellId: baseline-run
      columns: [Households, Government, "Central bank", Sum]
      sectors: [Households, Government, "Central bank", ""]
      rows:
        - [Bills, Bills, +B_h, -B_s, +B_cb, "0"]
        - [Cash, High-powered money, +H_h, "", -H_s, "0"]
        - [Balance, Net worth, -V, +B_s, "0", "0"]
        - [Sum, Sum, "0", "0", "0", "0"]
  - matrix:
      id: transaction-flow
      accountingKind: transaction-flow
      title: ABM-PC transactions-flow matrix (MC means)
      description: >
        Period flows among households, production, government, and the central bank.
        Use the period scrubber to inspect a single period after the run.
      sourceRunCellId: baseline-run
      columns: [Households, Production, Government, "Central bank", Sum]
      sectors: [Households, Firms, Government, "Central bank", ""]
      rows:
        - [Consumption, Consumption, -C, +C, "", "", "0"]
        - [Government, Government expenditure, "", +G, -G, "", "0"]
        - [Income, Wages, +Y, -Y, "", "", "0"]
        - [Taxes, Taxes, -TAX, "", +TAX, "", "0"]
        - [Bills, Change in bills, +d(B_h), "", -d(B_s), +d(B_cb), "0"]
        - [Cash, Change in cash, +d(H_h), "", "", -d(H_s), "0"]
        - [Sum, Sum, "0", "0", "0", "0", "0"]
  - run:
      id: baseline-run
      title: Monte Carlo baseline
      description: >
        ABM-PC Monte Carlo (mean paths). Defaults match the Leeds R script except
        `monteCarlo: 20` for a snappier browser run (R uses 100). Rate shock at period 60.
      mode: baseline
      engine: abm
      sourceModelId: abm-pc
      periods: 100
      resultKey: abm_pc_baseline
      abm:
        households: 200
        monteCarlo: 20
        alpha1m: 0.6
        alpha1d: 0
        alpha2: 0.4
        theta: 0.2
        pr: 1.1
        s: 0.2
        g0: 20
        lambda0: 0.635
        lambda1: 5
        lambda2: 0.01
        r0: 0.025
        r1: 0.035
        shockPeriod: 60
  - chart:
      id: chart-output
      title: Total output (MC mean)
      description: >
        MACRO output `Y` (MC mean with p10–p90 band). Vertical marker at period 60 is the
        interest-rate shock.
      showMcBands: true
      variables:
        - Y
      axisMode: separate
      axisSnapTolarance: 0.5
      seriesRanges:
        Y:
          includeZero: true
      sourceRunCellId: baseline-run
  - chart:
      id: chart-income-consumption
      title: Disposable income and consumption
      description: >
        MACRO means of disposable income `YD` and consumption `C` with p10–p90 bands
        (R panel b).
      showMcBands: true
      variables:
        - YD
        - C
      axisMode: shared
      axisSnapTolarance: 0.5
      seriesRanges:
        YD:
          includeZero: true
        C:
          includeZero: true
      sourceRunCellId: baseline-run
  - chart:
      id: chart-wealth
      title: Household wealth
      description: >
        MACRO household wealth `V` (MC mean with p10–p90 band). R panel c.
      showMcBands: true
      variables:
        - V
      axisMode: separate
      axisSnapTolarance: 0.5
      seriesRanges:
        V:
          includeZero: true
      sourceRunCellId: baseline-run
  - chart:
      id: chart-portfolio
      title: Portfolio — bills and cash
      description: >
        MACRO bills `B_h` and cash `H_h` (MC means with bands). The rate shock shifts
        wealth toward bills (R panel d).
      showMcBands: true
      variables:
        - B_h
        - H_h
      axisMode: shared
      axisSnapTolarance: 0.5
      seriesRanges:
        B_h:
          includeZero: true
        H_h:
          includeZero: true
      sourceRunCellId: baseline-run
  - chart:
      id: chart-unemployment
      title: Unemployment rate (emergent)
      description: >
        MACRO unemployment rate `UR` (MC mean with p10–p90 band). Emerges from the job
        lottery when hiring friction `s > 0` (R panel e).
      showMcBands: true
      variables:
        - UR
      axisMode: separate
      axisSnapTolarance: 0.5
      seriesRanges:
        UR:
          includeZero: true
      sourceRunCellId: baseline-run
  - chart:
      id: chart-household-first
      title: First household (micro, MC run 1)
      description: >
        MICRO paths for household 1 from MC run 1 only: consumption `c_h1`, wealth
        `v_h1`, employment `e_h1`. Matches R panel f.
      variables:
        - c_h1
        - v_h1
        - e_h1
      axisMode: separate
      axisSnapTolarance: 0.5
      seriesRanges:
        c_h1:
          includeZero: true
        v_h1:
          includeZero: true
        e_h1:
          includeZero: true
      sourceRunCellId: baseline-run
  - table:
      id: baseline-table
      title: Baseline variable summary
      description: >
        MACRO series summary (MC means). Micro probes are on the household chart above.
      variables:
        - Y
        - C
        - YD
        - V
        - B_h
        - H_h
        - H_s
        - UR
        - r
        - TAX
        - N
      sourceRunCellId: baseline-run
