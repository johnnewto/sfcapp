# *************************************************************************
#  Model SIM + agent-based microfoundation (ABM-SIM)
#  Source: Godley & Lavoie ch.3 (SIM), extended with a "job-lottery"
#  Author: Marco Veronese Passarella (Leeds lectures 2026)
# *************************************************************************
#  Description: A tiny "agent-based" version of the textbook SIM model:
#  several households, each with its own state money (cash) and its own
#  spending choice, added up to get the economy-wide totals.
#  Monte Carlo runs in the browser via a declarative abm-model cell
#  interpreted by runAbmSpec.
# *************************************************************************
#  Conventions: upper-case = MACRO total; lower-case = MICRO (one household)
# *************************************************************************
#  Story:
#    - each household decides how much it wants to spend (its OWN alpha1);
#    - the economy needs 1/pr workers for each unit people want to buy;
#    - a random job lottery fills those jobs (some stay unfilled = friction);
#    - whoever works makes pr goods and is paid a wage w = pr;
#    - goods are sold first-come-first-served until they run out;
#    - taxes are paid.
#  One single random shuffle of households per period decides BOTH who gets a
#  job AND who reaches the shop first.
# *************************************************************************
#  Note on heterogeneity: each household has its own fixed propensity to
#  consume out of income (alpha1 is a vector, drawn once). Because households
#  differ, aggregate demand depends on which of them earn income, so the random
#  order matters for the macro totals too. The effect is smaller than that of
#  the job-lottery noise.
# *************************************************************************
#  Reference R: references/leeds_lectures_2026/ABM_SIM.R
#  Upstream: https://github.com/marcoverpas/Leeds_lectures_2026/blob/main/ABM_SIM.R
format: sfcr-notebook-yaml
formatVersion: 1
id: abm-sim-notebook
title: ABM-SIM Browser Notebook
metadata:
  version: 1
  template: abm-sim
cells:
  # Overview (R header story / description)
  - markdown:
      id: intro
      title: Overview
      source: >
        Model **ABM-SIM** is Godley and Lavoie Model SIM populated by many households.
        Each household holds its own money, forms its own disposable income, and has its
        own propensity to consume. Macro totals emerge by summing over agents. This
        notebook runs a Monte Carlo of that agent-based model in the browser from a
        YAML-authored `abm-model` cell. The R reference is
        `references/leeds_lectures_2026/ABM_SIM.R`.
      more: |
        Aggregate and IO models are **top-down**: they write economy-wide behavioural
        rules directly. **Agent-based models (ABMs)** are **bottom-up**: they specify
        many individual agents — here households — and obtain macro variables by
        _summing over agents_. Aggregate regularities then **emerge** from interaction
        rather than being imposed.

        Three features distinguish this style:

        1. **Heterogeneity.** Each household has its own propensity to consume out of
           income (`alpha1`).
        2. **Interaction and matching.** A random **job lottery** (who is hired) and a
           **first-come-first-served** goods market (who gets served when output is short).
        3. **Sequential decisions.** Agents act from _last_ period's information, so there
           is no simultaneous equation system to iterate within the period.

        The model remains **stock-flow consistent**: money is only transferred between
        agents, so household money `H_d` tracks government money supply `H_s` to machine
        precision. The ABM is repeated with different random seeds (**Monte Carlo**); charts
        show the **mean** across runs.

        Mean output still converges toward `G / theta`, as in textbook SIM. With hiring
        friction `s > 0`, unemployment emerges, and wealth settles _above_ the frictionless
        SIM value because rationing creates involuntary saving.
  # Set model parameters / Define macro + micro stores (ABM_SIM.R)
  - abm-model:
      id: abm-sim-model
      title: ABM-SIM specification
      modelId: abm-sim
      description: >
        Declarative agent-based SIM: heterogeneous households, job lottery, FCFS goods
        market. Tick order matches Leeds ABM_SIM.R (`random.uniform` hiring draw before shuffle).
        Upper-case names are MACRO totals (Monte Carlo means); lower-case / `*_h*` names
        are MICRO histories from MC run 1 only — the same split as R's `store` vs
        `cHist`/`eHist`/`hHist`.
      more: |
        **Macro vs micro (Leeds convention).** The R script comments
        `upper-case = MACRO total; lower-case = MICRO (one household)`.

        - **Macro**: every aggregate tick variable is stored automatically as a Monte
          Carlo mean (banded p10–p90). No `record.series` allowlist.
        - **Micro**: first and last household, all state variables, from **MC run 1
          only** (not averaged) — `c_h1`, `h_hLast`, ….
        - **MC count**: set on the run cell as `abm.monteCarlo` (not on the model).

        Stock-flow check: `|H_d - H_s|` must stay within `tolerance` every period.

        **Period ticks.** One period unfolds as the ordered tick list below: plan
        consumption, hire via a job lottery, shuffle the queue, serve government then
        households first-come-first-served, pay wages and taxes, and update money
        holdings. Government spending rises from `20` to `30` at period `60`.

        1. Each household plans `cd = min(alpha1 * yd + alpha2 * h, h)` using its own
           `alpha1` and last period's disposable income and cash.
        2. Aggregate demand is `AD = sum(cd) + G`. Labour needed is `Nd = AD / pr`.
        3. Hiring: `N = min(floor(Nd * random.uniform(1-s, 1+s, 1)), floor(Nd), households.size)`.
        4. One random shuffle orders both jobs and the shop queue (`households.rank`).
        5. Households with `households.rank <= N` are employed (`e = 1`).
        6. Government is served first from produced goods `N * pr`; remaining output is
           rationed FCFS to households.
        7. Hired households earn wage `w = pr` (zero profit). Taxes `theta * y` are paid;
           money updates as `h = h + y - c - tax`. Money supply grows by `YG - TAX`.

        Setting `s = 0` with homogeneous `alpha1` recovers the textbook SIM money stock
        `H = (1 - theta) * (G / theta) * (1 - alpha1) / alpha2` in the limit.
      populations:
        # Number of households (if > output -> unemployment)
        - name: households
          size: 200
          state: [h, yd, cd, c, y, e]
          params:
            # Heterogeneous, time-invariant propensity to consume out of income
            # (drawn once; mean alpha1m, spread alpha1d → uniform [0.2, 1.0])
            alpha1: { draw: uniform, lo: 0.2, hi: 1.0 } # Propensity to consume out of income
      params:
        alpha2: 0.4 # Propensity to consume out of wealth (common to all)
        theta: 0.2 # Average tax rate on income
        pr: 1.1 # Product per worker (labour productivity)
        w: 1.1 # Wage per worker = productivity (=> zero profit)
        s: 0.2 # Size of the hiring randomness
        g0: 20 # Government spending baseline
        g1: 30 # Government spending after shock
        shockPeriod: 60 # Shock to government spending in period 60
      state:
        aggregates:
          H_s: 0 # Opening government money supply (R: H_s = 0)
      ticks:
        # --- TICK 1: households decide how much to spend ---
        - do:
            - [G, "if (t >= shockPeriod) { g1 } else { g0 }", "Government spending (shock from period 60)"]
        - for:
            households:
              - [cd, "min(alpha1 * yd + alpha2 * h, h)", "Planned consumption (own alpha1)"]
        - do:
            - [AD, "sum(households.cd) + G", "Total demand for goods"]
            - [Nd, "AD / pr", "Labour needed (1/pr workers per good)"]
            # --- TICK 2: households/workers are hired based on a job lottery ---
            - [N, "min(min(floor(Nd * random.uniform(1 - s, 1 + s, 1)), floor(Nd)), households.size)", "Job lottery hired count"]
        # --- TICK 3: households are re-shuffled ---
        # Random order of households for both jobs and goods (queue)
        - shuffle: households
        - for:
            households:
              - [e, "if (households.rank <= N) { 1 } else { 0 }", "Employment flag 0/1 (micro, MC run 1)"]
        - do:
            # --- TICK 4: goods are served first-come-first-served (FCFS) ---
            - [Y, "pr * N", "Output / income (MC mean)"]
            - [YG, "min(G, Y)", "Actual government spending (served first)"]
            - [YC, "Y - YG", "Goods left for households"]
        # Micro: actual consumption via FCFS rationing of YC
        - ration-fcfs:
            population: households
            demand: cd
            supply: YC
            into: c # Household consumption (micro, MC run 1)
        # --- TICK 5: wages are earned and then taxes are paid ---
        - for:
            households:
              - [y, "w * e", "Wage income if hired (w = pr, zero profit)"]
              - [yd, "y * (1 - theta)", "Disposable income net of taxes"]
              - [h, "h + y - c - theta * y", "Household money holdings (micro, MC run 1)"]
        # --- TICK 6: write down totals, store values and check consistency ---
        - do:
            - [C, "sum(households.c)", "Consumption (MC mean)"]
            - [YD, "sum(households.yd)", "Disposable income (MC mean)"]
            - [TAX, "theta * w * N", "Tax revenue"]
            - [H_d, "sum(households.h)", "Total household money (MC mean)"]
            - [H_s, "H_s + YG - TAX", "Government money supply (MC mean)"]
            - [UR, "(households.size - N) / households.size", "Unemployment rate, emergent (MC mean)"]
      # SFC check: record the worst gap between H_d and H_s
      check: { left: H_d, right: H_s, tolerance: "1e-9" }
  - matrix:
      id: balance-sheet
      accountingKind: balance-sheet
      title: ABM-SIM balance sheet (MC means)
      description: >
        Household money holdings mirror government money liabilities. Cells are linear in
        the Monte Carlo mean series, so row and column sums remain watertight.
      sourceRunCellId: baseline-run
      columns: [Households, Government, Sum]
      sectors: [Households, Government, ""]
      rows:
        - [Money, Money stock, +H_d, -H_s, "0"]
        - [Balance, Net worth, -H_d, +H_s, "0"]
        - [Sum, Sum, "0", "0", "0"]
  - matrix:
      id: transaction-flow
      accountingKind: transaction-flow
      title: ABM-SIM transactions-flow matrix (MC means)
      description: >
        Period flows among households, production, and government. Use the period scrubber
        to inspect a single period after the run.
      sourceRunCellId: baseline-run
      columns: [Households, Production, Government, Sum]
      sectors: [Households, Firms, Government, ""]
      rows:
        - [Consumption, Consumption, -C, +C, "", "0"]
        - [Government, Government expenditure, "", +G, -G, "0"]
        - [Income, Wages, +Y, -Y, "", "0"]
        - [Taxes, Taxes, -TAX, "", +TAX, "0"]
        - [Money, Change in money stock, +d(H_d), "", -d(H_s), "0"]
        - [Sum, Sum, "0", "0", "0", "0"]
  # Start the MC loop / Display the results (R: nPeriods, MC, set.seed)
  - run:
      id: baseline-run
      title: Monte Carlo baseline
      description: >
        ABM-SIM Monte Carlo (mean paths). Defaults match the Leeds R script except
        `monteCarlo: 20` for a snappier browser run (R uses 100).
      mode: baseline
      engine: abm
      sourceModelId: abm-sim
      # Periods
      periods: 100
      resultKey: abm_sim_baseline
      abm:
        # Number of households
        households: 200
        # MC simulations (R uses 100)
        monteCarlo: 20
        # Mean propensity to consume out of income
        alpha1m: 0.6
        # Spread of alpha1 around the mean
        alpha1d: 0.4
        # Propensity to consume out of wealth (common to all)
        alpha2: 0.4
        # Average tax rate on income
        theta: 0.2
        # Product per worker (labour productivity); wage w = pr
        pr: 1.1
        # Size of the hiring randomness
        s: 0.2
        # Government spending baseline
        g0: 20
        # Government spending after shock
        g1: 30
        # Shock to government spending in period 60 (from 20$ to 30$)
        shockPeriod: 60
  # Chart 1: Total output (R panel a)
  - chart:
      id: chart-output
      title: Total output (MC mean)
      description: >
        MACRO output `Y` (MC mean with p10–p90 band). Vertical shift at period 60 is the
        government-spending shock.
      showMcBands: true
      variables:
        - Y
        - G
      axisMode: separate
      axisSnapTolarance: 0.5
      seriesRanges:
        Y:
          includeZero: true
        G:
          includeZero: true
      sourceRunCellId: baseline-run
  # Chart 2: Disposable income and consumption (R panel b)
  - chart:
      id: chart-income-consumption
      title: Disposable income and consumption
      description: >
        MACRO means of disposable income `YD` and consumption `C` with p10–p90 bands
        (R panel b).
      showMcBands: true
      variables:
        - YD
        - C
      axisMode: shared
      axisSnapTolarance: 0.5
      seriesRanges:
        YD:
          includeZero: true
        C:
          includeZero: true
      sourceRunCellId: baseline-run
  # Chart 3: Total money stock (R panel c; dashed grey = homogeneous-SIM at mean alpha1)
  - chart:
      id: chart-money
      title: Money stock
      description: >
        MACRO household money `H_d` and government money `H_s` (MC means with p10–p90
        bands). With hiring friction, wealth sits above the frictionless SIM benchmark
        at mean alpha1.
      showMcBands: true
      variables:
        - H_d
        - H_s
      axisMode: shared
      axisSnapTolarance: 0.5
      seriesRanges:
        H_d:
          includeZero: true
        H_s:
          includeZero: true
      sourceRunCellId: baseline-run
  # Chart 4: Unemployment rate (emergent) (R panel d)
  - chart:
      id: chart-unemployment
      title: Unemployment rate (emergent)
      description: >
        MACRO unemployment rate `UR` (MC mean with p10–p90 band). Emerges from the job
        lottery when hiring friction `s > 0` (R panel d).
      showMcBands: true
      variables:
        - UR
      axisMode: separate
      axisSnapTolarance: 0.5
      seriesRanges:
        UR:
          includeZero: true
      sourceRunCellId: baseline-run
  # Chart 5: Consumption and employment of first household (R panel e; pink = unemployed)
  - chart:
      id: chart-household-first
      title: First household (micro, MC run 1)
      description: >
        MICRO paths for household 1 from MC run 1 only (not averaged): consumption
        `c_h1`, cash `h_h1`, employment `e_h1` (1 when employed). Matches R panel e.
      variables:
        - c_h1
        - h_h1
        - e_h1
      axisMode: separate
      axisSnapTolarance: 0.5
      seriesRanges:
        c_h1:
          includeZero: true
        h_h1:
          includeZero: true
        e_h1:
          includeZero: true
      sourceRunCellId: baseline-run
  # Chart 6: Consumption and employment of last household (R panel f; pink = unemployed)
  - chart:
      id: chart-household-last
      title: Last household (micro, MC run 1)
      description: >
        MICRO paths for the last household from MC run 1 only: `c_hLast`, `h_hLast`,
        `e_hLast`. Matches R panel f — compare with the first household to see
        heterogeneity and queue order.
      variables:
        - c_hLast
        - h_hLast
        - e_hLast
      axisMode: separate
      axisSnapTolarance: 0.5
      seriesRanges:
        c_hLast:
          includeZero: true
        h_hLast:
          includeZero: true
        e_hLast:
          includeZero: true
      sourceRunCellId: baseline-run
  # Calculate average values / Show details (R summary table)
  - table:
      id: baseline-table
      title: Baseline variable summary
      description: >
        MACRO series summary (MC means). Micro probes `c_h1` / `h_hLast` / … are
        available on the household charts above.
      variables:
        - Y
        - C
        - YD
        - H_d
        - H_s
        - UR
        - G
        - TAX
        - N
      sourceRunCellId: baseline-run
