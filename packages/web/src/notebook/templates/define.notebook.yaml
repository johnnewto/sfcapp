        - [dep_E, "E_F/lag(REV_E)", "energy depletion ratio eq22", "", aux, identity]
        - "2.1.3 Emissions and climate change"
        - [EMIS_F, "omega*(1-seq)*E_F", "fossil CO2 emissions (GtCO2) eq23", "", aux, identity]
        - [g_EMIS_L, "lag(g_EMIS_L)*(1-zeta_9)", "growth rate of land-use emissions eq24", "", aux, identity]
        - [EMIS_L, "lag(EMIS_L)*(1-g_EMIS_L)", "land-use CO2 emissions (GtCO2) eq25", "", aux, identity]
        - [EMIS, "EMIS_F+EMIS_L", "total CO2 emissions (GtCO2) eq26", "", aux, identity]
        - [CO2_CUM, "lag(CO2_CUM)+EMIS", "cumulative CO2 emissions (GtCO2) eq27", "", aux, identity]
        - [TEMP, "(1/(1-f_nc))*TCRE*CO2_CUM", "surface temperature change from the pre-industrial period (C) eq28", "", aux, identity]
        - "2.1.4 Ecological efficiency and technology"
        - [omega, "lag(omega)*(1+g_omega)", "CO2 intensity of fossil energy (GtCO2/EJ) eq29", "", aux, identity]
        - [g_omega, "lag(g_omega)*(1-zeta_1)", "growth rate of CO2 intensity of fossil energy eq30", "", aux, identity]
        - [mu, "mu_max-((mu_max-mu_min)/(1+pi_1*exp(-pi_2*((lag(KGNE))/(lag(KCNE))))))", "material intensity (Gt / US$ tn) eq31", "", aux, identity]
        - [rho, "rho_max/(1+pi_3*exp(-pi_4*((lag(KGNE))/(lag(KCNE)))))", "recycling rate eq32", "", aux, identity]
        - [epsilon, "epsilon_max-((epsilon_max-epsilon_min)/(1+pi_5*exp(-pi_6*((lag(KGE))/(lag(KCE))))))", "energy intensity (EJ / US$ tn) eq33", "", aux, identity]
        - [theta, "1/(1+pi_7*exp(-pi_8*((lag(KGE))/(lag(KCE)))))", "share of non-fossil energy in total energy eq34", "", aux, identity]
        - [seq, "1/(1+pi_9*exp(-pi_10*((lag(KSEQ))/(lag(KCE_PRI_S1)+lag(KCE_PRI_S2)))))", "proportion of carbon that is sequestrated eq35", "", aux, identity]
        - "2.2.1 Output determination"
