      axisMode: separate
      sourceRunCellId: scenario-6-run
      more: |
        Green credit rationing `CR_G` should ease relative to baseline as banks are asked to hold less capital against green loans.
  - markdown:
      id: scenario-7-note
      title: Sufficiency
      source: This scenario turns on the consumption-adjustment dummy and sets `phi = 0.25` from 2024, matching R scenario 10 / paper Figure 3 Sufficiency. On T=80 the R duration window covers the rest of the century.
      more: |
        `dummy_con_change` lets `con_change` rise toward `con_change_end`, and `phi` links hours to the unemployment gap. Together they slow consumption and labour demand.
  - run:
      id: scenario-7-run
      title: "Scenario 7: sufficiency"
      mode: scenario
      scenario:
        shocks:
          - rangeInclusive:
              - 4
              - 80
            variables:
