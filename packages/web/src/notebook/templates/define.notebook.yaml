      modelId: define
      collapsed: true
      method: gauss-seidel
      tolerance: "1e-8"
      maxIterations: 400
      defaultInitialValue: "0"
      hiddenLeftVariable: SEC_CB
      hiddenRightVariable: SEC_CBred
      hiddenTolerance: "1e-4"
      relativeHiddenTolerance: false
