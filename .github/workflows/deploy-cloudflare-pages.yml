name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VITE_BASE_PATH: /
      VITE_NOTEBOOK_ASSISTANT_API_URL: ${{ vars.VITE_NOTEBOOK_ASSISTANT_API_URL }}
      VITE_CHAT_BUILDER_API_URL: ${{ vars.VITE_CHAT_BUILDER_API_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build

      - name: Ensure Cloudflare Pages project sfcapp exists
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects"
          CODE="$(curl -sS -o /tmp/cf-pages-sfcapp.json -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "${API}/sfcapp")"
          if [ "$CODE" = "200" ]; then
            echo "Pages project sfcapp already exists"
            exit 0
          fi
          if [ "$CODE" != "404" ]; then
            echo "Unexpected response checking Pages project sfcapp (HTTP $CODE):"
            cat /tmp/cf-pages-sfcapp.json
            exit 1
          fi
          echo "Creating Pages project sfcapp"
          curl -sS -f -X POST "$API" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"name":"sfcapp","production_branch":"main"}'

      - name: Deploy to Cloudflare Pages
        run: pnpm dlx wrangler pages deploy packages/web/dist --project-name=sfcapp --branch=main
